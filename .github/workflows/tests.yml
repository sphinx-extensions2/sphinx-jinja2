name: continuous-integration

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:

jobs:

  pytest:

    name: Unit tests (${{matrix.os}}, python=${{matrix.python}}, sphinx${{matrix.sphinx}})

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        sphinx: [""]
        include:
        - os: ubuntu-latest
          python: "3.11"
          sphinx: "~=7.2"
        - os: ubuntu-latest
          python: "3.11"
          sphinx: "~=8.0"
        - os: ubuntu-latest
          python: "3.12"
          sphinx: "~=9.0"
        - os: ubuntu-latest
          python: "3.11"
          sphinx: "~=7.2.0"
          extra_deps: "minijinja==2.15.* myst-parser~=4.0"
        - os: windows-latest
          python: "3.13"
          sphinx: ""

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{matrix.python}}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx${{ matrix.sphinx }} ${{ matrix.extra_deps }} -e ".[testing]"
    - name: Run pytest
      run: pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

  docs-html:

    name: Build docs

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"
    - name: Run sphinx-build
      run: sphinx-build -nW --keep-going -b html docs/ docs/_build/html

  lint:

    name: Pre-commit

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Cache pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install pre-commit
      run: python -m pip install pre-commit
    - name: Run pre-commit
      run: pre-commit run --all-files

  package:

    name: Package smoke test

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Build and check package
      run: |
        python -m pip install build twine
        python -m build
        twine check dist/*

  check:
    # https://github.com/marketplace/actions/alls-green#why
    # This job does nothing and is only used for the branch protection

    if: always()

    needs:
    - pytest
    - docs-html
    - lint
    - package

    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}


  publish:

    name: Publish to PyPI
    needs:
    - check
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-jinja2/
    permissions:
      # required for PyPI trusted publishing
      id-token: write
      # for actions/checkout (explicit, since id-token drops other scopes to none)
      contents: read
    steps:
    - name: Checkout source
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Build package
      run: |
        python -m pip install build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
