name: continuous-integration

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:

jobs:

  pytest:

    name: Unit tests (python=${{matrix.python}}, sphinx${{matrix.sphinx}})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        sphinx: [""]
        include:
        - python: "3.11"
          sphinx: "~=7.2"
        - python: "3.11"
          sphinx: "~=8.0"
        - python: "3.12"
          sphinx: "~=9.0"

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{matrix.python}}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx${{matrix.sphinx}} -e ".[testing]"
    - name: Run pytest
      run: pytest --cov=src --cov-report=xml --cov-report=term-missing

  docs-html:

    name: Build docs

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"
    - name: Run sphinx-build
      run: sphinx-build -nW --keep-going -b html docs/ docs/_build/html

  check:
    # https://github.com/marketplace/actions/alls-green#why
    # This job does nothing and is only used for the branch protection

    if: always()

    needs:
    - pytest
    - docs-html

    runs-on: ubuntu-latest

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}


  publish:

    name: Publish to PyPI
    needs:
    - check
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sphinx-jinja2/
    permissions:
      # required for PyPI trusted publishing
      id-token: write
    steps:
    - name: Checkout source
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Build package
      run: |
        python -m pip install build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
